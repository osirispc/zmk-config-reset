name: ZMK Firmware Build

on:
  push:
    branches:
      - main
      - factory-reset
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: corne_left
          - board: nice_nano_v2
            shield: corne_right

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            .west
          key: ${{ runner.os }}-zmk-${{ hashFiles('**/west.yml') }}

      - name: Initialize west
        run: |
          pip install west
          west init -l .
          west update

      - name: Build firmware
        run: |
          west build -s zmk/app -b ${{ matrix.board }} \
            -- -DSHIELD=${{ matrix.shield }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.shield }}
          path: build/zephyr/zmk.uf2
