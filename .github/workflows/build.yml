name: Build ZMK firmware

on:
  push:
    branches: [ factory-reset ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: corne_left
          - board: nice_nano_v2
            shield: corne_right

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize ZMK
        uses: zmkfirmware/setup-zmk@v1

      - name: Build firmware
        run: |
          west build -b ${{ matrix.board }} -- -DSHIELD=${{ matrix.shield }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.shield }}
          path: build/zephyr/zmk.uf2
